<div class="shop-container">
  <!-- Step Progress Indicator -->
  <div class="step-progress-container">
    <div class="step-progress">
      <div class="step" 
           *ngFor="let step of steps" 
           [class]="getStepClass(step.number)"
           (click)="goToStep(step.number)">
        <div class="step-circle">
          <i class="material-icons" *ngIf="isStepCompleted(step.number)">check</i>
          <span *ngIf="!isStepCompleted(step.number)">{{ step.number }}</span>
        </div>
        <div class="step-info">
          <span class="step-name">{{ step.name }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Step Content -->
  <div class="step-content">
    <!-- Step 1: Browse Products -->
    <app-products *ngIf="currentStep === 1" 
                  (nextStep)="nextStep()" 
                  (addToCart)="onAddToCart($event)">
    </app-products>

    <!-- Step 2: Product Details -->
    <app-product-details *ngIf="currentStep === 2"
                         (nextStep)="nextStep()"
                         (previousStep)="previousStep()">
    </app-product-details>

    <!-- Step 3: Review Cart -->
    <app-cart *ngIf="currentStep === 3" 
              (nextStep)="nextStep()" 
              (previousStep)="previousStep()"
              (cartUpdate)="onCartUpdate()">
    </app-cart>

    <!-- Step 4: Checkout -->
    <app-step4-checkout *ngIf="currentStep === 4" 
                        (orderComplete)="onOrderComplete($event)"
                        (previousStep)="previousStep()">
    </app-step4-checkout>
  </div>

  <!-- Navigation Footer (for steps 1-3) -->
  <div class="navigation-footer" *ngIf="currentStep < 4">
    <div class="nav-buttons">
      <button class="btn btn-outline-secondary" 
              *ngIf="currentStep > 1"
              (click)="previousStep()">
        <i class="material-icons">arrow_back</i>
        {{ 'DEALER.SHOP.NAVIGATION.PREVIOUS' | translate }}
      </button>

      <div class="cart-info" *ngIf="currentStep === 1 && cartItemCount > 0">
        <span class="cart-count">{{ cartItemCount }} {{ 'DEALER.SHOP.NAVIGATION.ITEMS_IN_CART' | translate }}</span>
      </div>

      <button class="btn btn-primary" 
              *ngIf="currentStep < 3"
              [disabled]="!canProceedToNext()"
              (click)="nextStep()">
        {{ 'DEALER.SHOP.NAVIGATION.NEXT' | translate }}
        <i class="material-icons">arrow_forward</i>
      </button>
    </div>
  </div>
</div>
