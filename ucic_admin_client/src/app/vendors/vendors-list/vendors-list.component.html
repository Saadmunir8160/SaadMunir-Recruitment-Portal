<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <div class="row align-items-center">
                        <div class="col">
                            <h4 class="card-title">Vendors</h4>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row mb-3 align-items-center">
                        <div class="col-md-4">
                            <div class="search-box position-relative">
                                <input type="text" class="form-control ps-4" 
                                       [(ngModel)]="searchText" 
                                       (ngModelChange)="onSearch()" 
                                       placeholder="Search vendors...">
                                <iconify-icon icon="solar:magnifer-linear" class="search-widget-icon position-absolute top-50 end-0 translate-middle-y me-3"></iconify-icon>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           [(ngModel)]="showNotApprovedOnly" 
                                           (ngModelChange)="onNotApprovedChange()" 
                                           id="notApprovedOnly">
                                    <label class="form-check-label" for="notApprovedOnly">
                                        Not Approved Only
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" 
                                           [(ngModel)]="showApprovedOnly" 
                                           (ngModelChange)="onApprovedChange()" 
                                           id="approvedOnly">
                                    <label class="form-check-label" for="approvedOnly">
                                        Approved Only
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 d-flex justify-content-end">
                            <div class="d-flex align-items-center custom-page-size">
                                <label for="pageSize" class="me-2 mb-0 fw-semibold text-secondary">Show:</label>
                                <select id="pageSize" class="form-select form-select-sm stylish-select" 
                                        [(ngModel)]="pageSize" 
                                        (ngModelChange)="onPageSizeChange($event)"
                                        style="width: 80px;">
                                    <option *ngFor="let size of pageSizeOptions" [ngValue]="size === 'All' ? 0 : size">{{ size === 'All' ? 'All' : size }}</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-centered table-nowrap mb-0 align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Name</th>
                                    <th>Contact Person</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Business Partner ID</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngIf="loading">
                                    <td colspan="7" class="text-center">
                                        <div class="d-flex justify-content-center align-items-center py-3">
                                            <div class="spinner-border spinner-border-sm me-2" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                            Loading...
                                        </div>
                                    </td>
                                </tr>
                                <tr *ngFor="let vendor of filteredVendorsList; trackBy: trackByVendorId">
                                    <td>{{ vendor.name }}</td>
                                    <td>{{ vendor.contactPerson }}</td>
                                    <td>{{ vendor.email }}</td>
                                    <td>{{ vendor.phoneNo }}</td>
                                    <td>
                                        <span class="badge" [ngClass]="vendor.isApproved ? 'bg-success' : 'bg-warning'">
                                            {{ vendor.isApproved ? 'Approved' : 'Not Approved' }}
                                        </span>
                                    </td>
                                    <td>{{ vendor.bpId || '-' }}</td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-info me-1" (click)="showVendorDetails(vendor)">
                                            <iconify-icon icon="solar:eye-bold-duotone"></iconify-icon>
                                        </button>
                                        <button *ngIf="!vendor.isApproved" 
                                                class="btn btn-sm btn-success me-1" 
                                                (click)="approveVendors(vendor.vendorId)"
                                                [disabled]="isLoading(vendor.vendorId)">
                                            <span *ngIf="isLoading(vendor.vendorId)" class="spinner-border spinner-border-sm me-1"></span>
                                            <iconify-icon *ngIf="!isLoading(vendor.vendorId)" icon="solar:check-circle-bold-duotone"></iconify-icon>
                                        </button>
                                        <button class="btn btn-sm btn-danger" 
                                                (click)="deleteVendor(vendor.vendorId)"
                                                [disabled]="isDeleting(vendor.vendorId)"
                                                *ngIf="!vendor.isApproved">
                                            <span *ngIf="isDeleting(vendor.vendorId)" class="spinner-border spinner-border-sm"></span>
                                            <iconify-icon *ngIf="!isDeleting(vendor.vendorId)" icon="solar:trash-bin-minimalistic-bold-duotone"></iconify-icon>
                                        </button>
                                    </td>
                                </tr>
                                <tr *ngIf="!loading && filteredVendorsList.length === 0">
                                    <td colspan="7" class="text-center py-4">
                                        <p class="text-muted mb-0">No vendors found.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <app-pagination
                        *ngIf="!loading && totalCount > 0 && pageSize !== 0"
                        [currentPage]="currentPage"
                        [totalPages]="totalPages"
                        [hasPreviousPage]="currentPage > 1"
                        [hasNextPage]="currentPage < totalPages"
                        [pageSize]="pageSize"
                        [totalCount]="totalCount"
                        (pageChange)="goToPage($event)">
                    </app-pagination>
                </div>
            </div>
        </div>
    </div>
</div>
