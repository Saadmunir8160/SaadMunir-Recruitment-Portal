<div class="sidebar">
  <h3>Admin Panel</h3>

        <ul>
            <li><a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
            <li><a routerLink="/users">Users</a></li>
            <li><a routerLink="/settings">Settings</a></li>
            <li><a (click)="logout()">Logout</a></li>
        </ul>
    </nav> -->

  <div class="main-nav">
    <!-- Sidebar Logo -->
    <div class="logo-box" style="border-bottom: 4px solid var(--bs-primary);">
      <a href="index.html" class="logo-light">
        <img src="assets/images/logo-light.png" style="height: 98px;width: 230px;" class="logo-lg" alt="logo light">
        <img src="assets/images/logo-sm.png" class="logo-sm" alt="logo small">
      </a>
    </div>

    <!-- Menu Toggle Button (sm-hover) -->


    <div class="scrollbar" data-simplebar>
      <ul class="navbar-nav" id="navbar-nav">
        <!-- Menu Items -->
        <ng-container *ngFor="let item of menuItems">
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.route" [class.active]="isMenuActive(item)">
              <span class="nav-icon">
                <iconify-icon [icon]="item.icon"></iconify-icon>
              </span>
              <span class="nav-text">{{ item.title }}</span>
            </a>
          </li>
        </ng-container>

        <!-- Logout Button -->
        <li class="nav-item">
          <a class="nav-link" href="javascript:void(0)" (click)="logout()">
            <span class="nav-icon">
              <iconify-icon icon="solar:logout-2-bold-duotone"></iconify-icon>
            </span>
            <span class="nav-text">Logout</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
