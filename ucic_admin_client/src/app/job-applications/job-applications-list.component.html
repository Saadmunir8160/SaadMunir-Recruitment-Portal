<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <div class="row align-items-center">
            <div class="col">
              <h4 class="card-title mb-0">Job Applications</h4>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="row mb-3 align-items-center">
            <div class="col-md-6">
              <div class="search-box position-relative">
                <input type="text" class="form-control ps-4" 
                       [(ngModel)]="searchTerm" 
                       (ngModelChange)="onSearch()" 
                       placeholder="Search job applications...">
                <iconify-icon icon="solar:magnifer-linear" class="search-widget-icon position-absolute top-50 end-0 translate-middle-y me-3"></iconify-icon>
              </div>
            </div>
            <div class="col-md-6 d-flex justify-content-end">
              <div class="d-flex align-items-center custom-page-size">
                <label for="pageSize" class="me-2 mb-0 fw-semibold text-secondary">Show:</label>
                <select id="pageSize" class="form-select form-select-sm stylish-select" 
                        [(ngModel)]="pageSize" 
                        (ngModelChange)="onPageSizeChange($event)"
                        style="width: 80px;">
                  <option *ngFor="let size of pageSizeOptions" [ngValue]="size === 'All' ? 0 : size">{{ size === 'All' ? 'All' : size }}</option>
                </select>
              </div>
            </div>
          </div>

          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

          <div class="table-responsive">
            <table class="table table-centered table-nowrap mb-0 align-middle">
              <thead class="table-light">
                <tr>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Job Title</th>
                  <th>Resume</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngIf="loading">
                  <td colspan="5" class="text-center">
                    <div class="d-flex justify-content-center align-items-center py-3">
                      <div class="spinner-border spinner-border-sm me-2" role="status">
                        <span class="visually-hidden">Loading...</span>
                      </div>
                      Loading...
                    </div>
                  </td>
                </tr>
                <tr *ngFor="let app of filteredJobApplications; trackBy: trackByJobApplicationId">
                  <td>{{ app.fullName }}</td>
                  <td>{{ app.email }}</td>
                  <td>{{ app.phone }}</td>
                  <td>{{ app.jobTitle }}</td>
                  <td>
                    <a *ngIf="app.resumePath" [href]="getFullPath(app.resumePath)" target="_blank">
                      <button class="btn btn-primary btn-sm">Download</button>
                    </a>
                  </td>
                </tr>
                <tr *ngIf="!loading && filteredJobApplications.length === 0">
                  <td colspan="5" class="text-center py-4">
                    <p class="text-muted mb-0">No job applications found.</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <app-pagination
            *ngIf="!loading && totalCount > 0"
            [currentPage]="currentPage"
            [totalPages]="totalPages"
            [hasPreviousPage]="currentPage > 1"
            [hasNextPage]="currentPage < totalPages"
            [pageSize]="pageSize"
            [totalCount]="totalCount"
            (pageChange)="goToPage($event)">
          </app-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
