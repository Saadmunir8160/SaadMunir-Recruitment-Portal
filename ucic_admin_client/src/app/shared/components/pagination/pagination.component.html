<div class="row mt-3">
  <div class="col-md-6">
    <p class="text-muted mb-0">{{ getShowingText() }}</p>
  </div>
  <div class="col-md-6" *ngIf="pageSize !== 0">
    <nav aria-label="Pagination" class="d-flex justify-content-end">
      <ul class="pagination pagination-sm mb-0">
        <li class="page-item" [class.disabled]="!hasPreviousPage">
          <button class="page-link" (click)="pageChange.emit(currentPage - 1)" [disabled]="!hasPreviousPage">
            <span class="pagination-arrow">‹</span>
          </button>
        </li>
        <li class="page-item" *ngFor="let page of getPageNumbers()" [class.active]="page === currentPage">
          <button class="page-link" (click)="pageChange.emit(page)">{{ page }}</button>
        </li>
        <li class="page-item" [class.disabled]="!hasNextPage">
          <button class="page-link" (click)="pageChange.emit(currentPage + 1)" [disabled]="!hasNextPage">
            <span class="pagination-arrow">›</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
