<div class="modal fade show d-block" tabindex="-1" role="dialog" style="background-color: rgba(0, 0, 0, 0.5);">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Password</h5>
        <button type="button" class="btn-close" (click)="onCancel()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Success Message -->
        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
          {{ successMessage }}
          <button type="button" class="btn-close" (click)="successMessage = ''" aria-label="Close"></button>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
        </div>

        <!-- Change Password Form -->
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
          <!-- Current Password -->
          <div class="mb-3">
            <label for="currentPassword" class="form-label">Current Password <span class="text-danger">*</span></label>
            <input
              type="password"
              class="form-control"
              id="currentPassword"
              formControlName="currentPassword"
              placeholder="Enter your current password"
              [class.is-invalid]="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched"
            />
            <div class="invalid-feedback" *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched">
              <span *ngIf="changePasswordForm.get('currentPassword')?.errors?.['required']">Current password is required</span>
            </div>
          </div>

          <!-- New Password -->
          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password <span class="text-danger">*</span></label>
            <input
              type="password"
              class="form-control"
              id="newPassword"
              formControlName="newPassword"
              placeholder="Enter new password (min 6 characters)"
              [class.is-invalid]="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched"
            />
            <div class="invalid-feedback" *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
              <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">New password is required</span>
              <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters</span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirm new password"
              [class.is-invalid]="changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched"
            />
            <div class="invalid-feedback" *ngIf="changePasswordForm.get('confirmPassword')?.invalid && changePasswordForm.get('confirmPassword')?.touched">
              <span *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['required']">Please confirm your password</span>
              <span *ngIf="changePasswordForm.errors?.['passwordMismatch']">Passwords do not match</span>
            </div>
          </div>

          <!-- Form-level password mismatch error -->
          <div *ngIf="changePasswordForm.errors?.['passwordMismatch']" class="alert alert-warning">
            New password and confirm password do not match
          </div>

          <!-- Buttons -->
          <div class="d-flex gap-2 justify-content-end">
            <button
              type="button"
              class="btn btn-secondary"
              (click)="onCancel()"
              [disabled]="loading"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="!changePasswordForm.valid || loading"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ loading ? 'Changing Password...' : 'Change Password' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
